plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
    id 'com.google.devtools.ksp' version '2.2.21-2.0.4'
}

android {
    namespace 'app.audioflow'
    compileSdk 36
    defaultConfig {
        applicationId 'app.audioflow'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.7.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    buildTypes { debug { applicationIdSuffix '.debug' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md']
    }
}
kotlin { jvmToolchain(17) }

def releaseNotesFile = layout.projectDirectory.file('src/main/assets/whats-new.md')
def releaseNotesVersion = android.defaultConfig.versionName
def checkReleaseNotes = tasks.register('checkReleaseNotes') {
    inputs.file(releaseNotesFile)
    inputs.property('versionName', releaseNotesVersion)
    doLast {
        def file = releaseNotesFile.asFile
        def lines = file.readLines('UTF-8')
        if (file.length() > 16384 || lines.isEmpty() ||
                lines[0] != "## AudioFlow ${releaseNotesVersion}" || lines.drop(1).join('\n').trim().isEmpty()) {
            throw new GradleException("Update src/main/assets/whats-new.md for AudioFlow ${releaseNotesVersion}.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn(checkReleaseNotes) }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.12.00')
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.media3:media3-exoplayer:1.9.2'
    implementation 'androidx.media3:media3-datasource-okhttp:1.9.2'
    implementation 'androidx.media3:media3-session:1.9.2'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
