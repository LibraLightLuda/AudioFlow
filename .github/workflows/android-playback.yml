name: Android playback check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.audioflow.DeviceTest#sharedYouTubeVideoStartsPlaybackAndSavesToDefault --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-playback-results
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
